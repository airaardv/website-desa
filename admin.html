<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Aduan | Desa Serunai</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        .admin-page {
            min-height: 100vh;
            padding: 70px 6%;
        }

        .admin-box {
            max-width: 1100px;
            margin: auto;

            padding: 40px;

            background: rgba(255,255,255,0.82);

            border-radius: 30px;

            box-shadow:
                0 15px 40px
                rgba(75,90,140,0.15);

            backdrop-filter: blur(15px);
        }

        .admin-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .admin-title .label {
            color: #765bc2;
            font-weight: bold;
        }

        .admin-title h1 {
            color: #304b68;
        }

        .aduan-admin {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 20px;

            box-shadow:
                0 5px 20px
                rgba(75,90,140,0.08);
        }

        .aduan-admin h2 {
            color: #304b68;
        }

        .aduan-admin p {
            color: #526984;
        }

        .token-admin {
            color: #765bc2;
            font-weight: bold;
        }

        .status-admin {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            background: #eee8ff;
            color: #765bc2;
            font-weight: bold;
        }

        .status-admin.selesai {
            background: #e4f8ed;
            color: #3b9563;
        }

        .jawaban-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-top: 10px;
            min-height: 80px;
        }

        .admin-button {
            margin-top: 12px;
            padding: 11px 20px;
            border: none;
            border-radius: 20px;
            background: #9072d5;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .pesan-admin {
            text-align: center;
            color: #765bc2;
        }

    </style>

</head>


<body>


    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>


    <header>

        <div class="logo">
            Desa Serunai
        </div>

        <nav>

            <a href="index.html">
                Beranda
            </a>

            <a href="profil.html">
                Profil
            </a>

            <a href="fasilitas.html">
                Fasilitas
            </a>

            <a href="lingkungan.html">
                Lingkungan
            </a>

            <a href="kegiatan.html">
                Kegiatan
            </a>

            <a href="aduan.html">
                Aduan
            </a>

            <a href="admin.html"
               class="active">
                Admin
            </a>

        </nav>

    </header>


    <main class="admin-page">

        <div class="admin-box">


            <div class="admin-title">

                <p class="label">
                    ADMIN DESA SERUNAI
                </p>

                <h1>
                    Daftar Aduan Masyarakat
                </h1>

                <p>
                    Lihat dan konfirmasi aduan masyarakat.
                </p>

            </div>


            <div id="daftarAduan">

                <p class="pesan-admin">
                    ⏳ Memuat data aduan...
                </p>

            </div>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Desa Serunai. Semua Hak Dilindungi.
        </p>

    </footer>


    <script>

        const API_ADUAN =
            "https://script.google.com/macros/s/AKfycbw-L7IMYuUM44FBT_hWW8Sn0xzvXvfEPaYpT8M7Yvt_8tvaSo9ZchyL3w4gG29xix02/exec";


        const daftarAduan =
            document.getElementById(
                "daftarAduan"
            );


        async function loadAduan() {


            try {


                const response =
                    await fetch(
                        API_ADUAN +
                        "?action=getAduan&t=" +
                        Date.now()
                    );


                const data =
                    await response.json();


                daftarAduan.innerHTML =
                    "";


                if (
                    data.length === 0
                ) {

                    daftarAduan.innerHTML =
                        "<p class='pesan-admin'>Belum ada aduan.</p>";

                    return;

                }


                data.reverse();


                data.forEach(
                    function(item) {


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "aduan-admin";


                        const sudah =
                            item.status ===
                            "Terkonfirmasi";


                        card.innerHTML = `

                            <h2>
                                ${item.judul}
                            </h2>

                            <p>
                                <strong>Token:</strong>
                                <span class="token-admin">
                                    ${item.token}
                                </span>
                            </p>

                            <p>
                                <strong>Nama:</strong>
                                ${item.nama}
                            </p>

                            <p>
                                <strong>Email:</strong>
                                ${item.email}
                            </p>

                            <p>
                                <strong>Kategori:</strong>
                                ${item.kategori}
                            </p>

                            <p>
                                <strong>Deskripsi:</strong><br>
                                ${item.deskripsi}
                            </p>

                            <p>
                                <strong>Status:</strong><br>

                                <span class="status-admin ${sudah ? "selesai" : ""}">
                                    ${sudah ? "✓ Terkonfirmasi" : "🕐 Menunggu"}
                                </span>

                            </p>

                            <textarea
                                class="jawaban-input"
                                id="jawaban-${item.baris}"
                                placeholder="Tulis jawaban admin..."
                            >${item.jawaban || ""}</textarea>

                            <br>

                            <button
                                class="admin-button"
                                onclick="konfirmasiAduan(${item.baris})"
                                ${sudah ? "disabled" : ""}
                            >
                                ${sudah ? "✓ Sudah Dikonfirmasi" : "Konfirmasi Aduan"}
                            </button>

                        `;


                        daftarAduan.appendChild(
                            card
                        );

                    }
                );


            } catch (error) {


                console.error(error);


                daftarAduan.innerHTML =

                    "<p class='pesan-admin'>" +
                    "❌ Gagal mengambil data aduan." +
                    "</p>";

            }

        }



        async function konfirmasiAduan(baris) {


            const jawaban =
                document.getElementById(
                    "jawaban-" + baris
                ).value.trim();


            if (!jawaban) {

                alert(
                    "Silakan tulis jawaban admin terlebih dahulu."
                );

                return;

            }


            try {


                const response =
                    await fetch(
                        API_ADUAN,
                        {

                            method: "POST",

                            body:
                                JSON.stringify({

                                    action:
                                        "updateStatus",

                                    baris:
                                        baris,

                                    status:
                                        "Terkonfirmasi",

                                    jawaban:
                                        jawaban

                                })

                        }
                    );


                const hasil =
                    await response.json();


                if (
                    hasil.status ===
                    "success"
                ) {

                    alert(
                        "Aduan berhasil dikonfirmasi!"
                    );


                    loadAduan();

                } else {

                    alert(
                        "Gagal mengkonfirmasi aduan."
                    );

                }


            } catch (error) {

                console.error(error);

                alert(
                    "Terjadi kesalahan."
                );

            }

        }


        loadAduan();

    </script>


</body>

</html>
