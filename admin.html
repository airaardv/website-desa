<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | Desa Serunai</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================
           LOGIN
        ========================= */

        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 40px;

            background: rgba(255,255,255,0.85);

            border-radius: 30px;

            box-shadow:
                0 15px 40px
                rgba(75,90,140,0.15);

            backdrop-filter: blur(15px);

            text-align: center;
        }

        .login-box h1 {
            color: #304b68;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #60738b;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 14px;

            border: 1px solid #ddd;
            border-radius: 15px;

            margin-bottom: 15px;

            box-sizing: border-box;

            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 20px;

            background: #9072d5;
            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.85;
        }

        .login-error {
            color: #d9534f;
            font-weight: bold;
            margin-top: 15px;
        }


        /* =========================
           ADMIN
        ========================= */

        .admin-page {
            min-height: 100vh;
            padding: 70px 6%;
        }

        .admin-box {
            max-width: 1200px;
            margin: auto;

            padding: 35px;

            background: rgba(255,255,255,0.75);

            border-radius: 30px;

            box-shadow:
                0 15px 40px
                rgba(75,90,140,0.15);

            backdrop-filter: blur(15px);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;
        }

        .admin-header h1 {
            color: #304b68;
            font-size: 38px;
        }

        .logout {
            padding: 12px 22px;

            border: none;
            border-radius: 25px;

            background: #9072d5;
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        .status {
            text-align: center;

            margin-bottom: 25px;

            color: #60738b;

            font-weight: bold;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            background: rgba(255,255,255,0.85);

            border-radius: 15px;

            overflow: hidden;
        }

        th {
            padding: 15px;

            background: linear-gradient(
                135deg,
                #71cbed,
                #9072d5
            );

            color: white;

            text-align: left;
        }

        td {
            padding: 15px;

            border-bottom:
                1px solid #e4e4ee;

            color: #526984;
        }

        tr:hover {
            background: rgba(235,230,255,0.5);
        }

        .badge {
            display: inline-block;

            padding: 7px 13px;

            border-radius: 20px;

            background: #eee8ff;

            color: #765bc2;

            font-size: 13px;

            font-weight: bold;
        }

        .confirm-btn {
            padding: 9px 16px;

            border: none;

            border-radius: 20px;

            background: #9072d5;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .confirm-btn:hover {
            opacity: 0.85;
        }

        .confirmed {
            background: #e4f8ed;

            color: #3b9563;
        }

        .empty {
            text-align: center;

            padding: 40px;

            color: #718198;
        }


        @media(max-width:700px) {

            .admin-page {
                padding: 40px 4%;
            }

            .admin-box {
                padding: 20px;
            }

            .admin-header {
                flex-direction: column;
                gap: 15px;
            }

            .admin-header h1 {
                font-size: 30px;
                text-align: center;
            }

            th,
            td {
                padding: 10px;
                font-size: 13px;
            }

        }

    </style>

</head>


<body>

    <!-- DEKORASI -->

    <div class="shape shape1"></div>
    <div class="shape shape2"></div>


    <!-- NAVIGASI -->

    <header>

        <div class="logo">
            Desa Serunai
        </div>

        <nav>

            <a href="index.html">Beranda</a>

            <a href="profil.html">Profil</a>

            <a href="fasilitas.html">Fasilitas</a>

            <a href="lingkungan.html">Lingkungan</a>

            <a href="kegiatan.html">Kegiatan</a>

        </nav>

    </header>


    <!-- =========================
         LOGIN ADMIN
    ========================= -->

    <div class="login-page" id="loginPage">

        <div class="login-box">

            <h1>🔐 Login Admin</h1>

            <p>
                Masuk untuk mengelola data aduan.
            </p>

            <input
                type="password"
                id="password"
                placeholder="Masukkan password"
                onkeydown="if(event.key === 'Enter') login()"
            >

            <button
                class="login-btn"
                onclick="login()">

                Masuk

            </button>

            <div
                class="login-error"
                id="loginError">
            </div>

        </div>

    </div>


    <!-- =========================
         HALAMAN ADMIN
    ========================= -->

    <main
        class="admin-page"
        id="adminPage"
        style="display:none;">

        <div class="admin-box">

            <div class="admin-header">

                <h1>
                    📋 Data Aduan
                </h1>

                <button
                    class="logout"
                    onclick="logout()">

                    Keluar

                </button>

            </div>


            <div
                class="status"
                id="status">

                ⏳ Memuat data aduan...

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Nama</th>

                            <th>Email</th>

                            <th>Kategori</th>

                            <th>Judul</th>

                            <th>Deskripsi</th>

                            <th>Status</th>

                            <th>Aksi</th>

                        </tr>

                    </thead>

                    <tbody id="dataAduan">

                    </tbody>

                </table>

            </div>

        </div>

    </main>


<script>


const API =
"https://script.google.com/macros/s/AKfycbxWX-4-dvX_cE5C06ku04HOWP8D1buWyfQEOkdtqHyENTn83gyqVWhPDBZfevCnacUU/exec";


/* =========================
   LOGIN
========================= */

function login() {

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("loginError");


    if (password === "admin123") {

        document.getElementById("loginPage").style.display = "none";

        document.getElementById("adminPage").style.display = "block";

        sessionStorage.setItem("adminLogin", "true");

        loadAduan();

    } else {

        error.innerHTML =
            "❌ Password salah!";

    }

}


/* =========================
   CEK LOGIN
========================= */

if (sessionStorage.getItem("adminLogin") === "true") {

    document.getElementById("loginPage").style.display = "none";

    document.getElementById("adminPage").style.display = "block";

    loadAduan();

}


/* =========================
   AMBIL DATA ADUAN
========================= */

function loadAduan() {

    const status =
        document.getElementById("status");

    const tbody =
        document.getElementById("dataAduan");


    status.innerHTML =
        "⏳ Memuat data aduan...";


    fetch(
        API +
        "?action=getAduan&t=" +
        new Date().getTime()
    )

    .then(response => response.json())

    .then(data => {

        tbody.innerHTML = "";


        if (!data || data.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        Belum ada aduan.
                    </td>
                </tr>
            `;

            status.innerHTML =
                "📭 Belum ada data aduan.";

            return;
        }


        data.reverse().forEach(item => {

            const row =
                document.createElement("tr");


            let statusHTML;
            let aksiHTML;


            if (item.status === "Terkonfirmasi") {

                statusHTML = `
                    <span class="badge confirmed">
                        ✓ Terkonfirmasi
                    </span>
                `;

                aksiHTML = `
                    <span class="badge confirmed">
                        Sudah dikonfirmasi
                    </span>
                `;

            } else {

                statusHTML = `
                    <span class="badge">
                        Menunggu
                    </span>
                `;

                aksiHTML = `
                    <button
                        class="confirm-btn"
                        onclick="konfirmasi(${item.baris})">

                        Konfirmasi

                    </button>
                `;

            }


            row.innerHTML = `

                <td>${item.nama || ""}</td>

                <td>${item.email || ""}</td>

                <td>${item.kategori || ""}</td>

                <td>${item.judul || ""}</td>

                <td>${item.deskripsi || ""}</td>

                <td>${statusHTML}</td>

                <td>${aksiHTML}</td>

            `;


            tbody.appendChild(row);

        });


        status.innerHTML =
            "✅ Data aduan berhasil dimuat.";

    })


    .catch(error => {

        console.error(error);

        status.innerHTML =
            "❌ Gagal memuat data aduan.";

    });

}


/* =========================
   KONFIRMASI
========================= */

function konfirmasi(baris) {

    const yakin = confirm(
        "Konfirmasi aduan ini?"
    );


    if (!yakin) {
        return;
    }


    fetch(API, {

        method: "POST",

        body: JSON.stringify({

            action: "updateStatus",

            baris: baris,

            status: "Terkonfirmasi"

        })

    })


    .then(response => response.json())


    .then(data => {

        if (data.status === "success") {

            alert(
                "✅ Aduan berhasil dikonfirmasi!"
            );

            loadAduan();

        } else {

            alert(
                "❌ Gagal mengonfirmasi aduan."
            );

        }

    })


    .catch(error => {

        console.error(error);

        alert(
            "❌ Terjadi kesalahan."
        );

    });

}


/* =========================
   LOGOUT
========================= */

function logout() {

    sessionStorage.removeItem("adminLogin");

    window.location.reload();

}


</script>


</body>

</html>
